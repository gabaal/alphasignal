[package]
name = "docforge"
version = "2.2.0"
edition = "2021"
description = "Official Rust Client Library for DocForge PDF API Engine"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
