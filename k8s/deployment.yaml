apiVersion: apps/v1
kind: Deployment
metadata:
  name: docforge-backend-deployment
  namespace: docforge-production
  labels:
    app.kubernetes.io/name: docforge-backend
    app.kubernetes.io/version: "3.0.0"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: docforge-backend
  template:
    metadata:
      labels:
        app: docforge-backend
    spec:
      containers:
      - name: docforge-backend
        image: docforge/backend-engine:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
          name: http-ws
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docforge-backend-service
  namespace: docforge-production
spec:
  type: LoadBalancer
  selector:
    app: docforge-backend
  ports:
  - port: 80
    targetPort: 4000
    name: http
  - port: 443
    targetPort: 4000
    name: https
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docforge-backend-hpa
  namespace: docforge-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docforge-backend-deployment
  minReplicas: 3
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
