version: '3.8'

services:
  docforge-backend:
    build:
      context: ./docforge-backend
      dockerfile: Dockerfile
    container_name: docforge-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - docforge_data:/app/data
      - docforge_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  docforge-studio:
    build:
      context: ./docforge-studio
      dockerfile: Dockerfile
    container_name: docforge-studio
    ports:
      - "4001:80"
    depends_on:
      - docforge-backend
    restart: unless-stopped

  docforge-landing:
    build:
      context: ./docforge-landing
      dockerfile: Dockerfile
    container_name: docforge-landing
    ports:
      - "4002:80"
    depends_on:
      - docforge-backend
    restart: unless-stopped

volumes:
  docforge_data:
    driver: local
  docforge_storage:
    driver: local
