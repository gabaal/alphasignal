version: '3.8'

services:
  docforge-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: docforge-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DOCFORGE_CONCURRENCY=5
      - REDIS_URL=redis://redis:6379
      - DOCFORGE_WEBHOOK_SECRET=df_whsec_prod_99182310192381
    volumes:
      - docforge_data:/app/data
      - docforge_storage:/app/storage
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: docforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  docforge-studio:
    image: nginx:alpine
    container_name: docforge-studio
    restart: always
    ports:
      - "4001:80"
    volumes:
      - ./docforge-studio:/usr/share/nginx/html:ro

  docforge-landing:
    image: nginx:alpine
    container_name: docforge-landing
    restart: always
    ports:
      - "4002:80"
    volumes:
      - ./docforge-landing:/usr/share/nginx/html:ro

  nginx-proxy:
    image: nginx:alpine
    container_name: docforge-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - docforge-api
      - docforge-studio
      - docforge-landing

volumes:
  docforge_data:
  docforge_storage:
  redis_data:
